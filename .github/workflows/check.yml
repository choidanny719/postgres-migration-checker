name: Check migrations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: docker pull postgres:16
      - run: python -m pytest -q tests/test_rehearsal.py --database-engine docker
      - name: Rehearse the example migrations through the installed CLI
        working-directory: examples/catalog
        run: |
          pg-migration-check --baseline baseline.sql --seed seed.sql --migration add-isbn.sql --query client-query.sql
          status=0
          pg-migration-check --baseline baseline.sql --seed seed.sql --migration rename-title.sql --query client-query.sql --format json > result.json || status=$?
          test "$status" -eq 1
          python -c 'import json; assert json.load(open("result.json"))["stage"].startswith("migrated query")'
